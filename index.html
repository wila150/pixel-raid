<script>
// App 內建瀏覽器（LINE、Facebook、IG…）一律跳到手機的瀏覽器開
(function () {
  var ua = navigator.userAgent || "", u = new URL(location.href);
  if (/ Line\//i.test(ua)) { // LINE：加上 openExternalBrowser=1 就會自動用外部瀏覽器開
    if (!u.searchParams.has("openExternalBrowser")) { u.searchParams.set("openExternalBrowser", "1"); location.replace(u.toString()); }
    return;
  }
  if (!/FBAN|FBAV|FB_IAB|Instagram|Messenger|Threads|MicroMessenger|KAKAOTALK|TikTok|musical_ly|BytedanceWebview/i.test(ua)) return;
  if (/Android/i.test(ua)) { // Android：用 intent 叫 Chrome 打開
    location.href = "intent://" + location.host + location.pathname + location.search + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(location.href) + ";end";
  }
  window.__inApp = true; // iPhone 沒辦法自動跳，畫面上教他怎麼開
  document.addEventListener("DOMContentLoaded", function () {
    var d = document.createElement("div");
    d.id = "inapp";
    d.innerHTML = '<div class="inapp-box"><h2>請用瀏覽器開啟</h2><p>這個 App 的內建瀏覽器沒辦法正常玩（存檔、登入會出問題）。</p>' +
      '<p class="inapp-step">' + (/iPhone|iPad/i.test(ua) ? "點右上角「⋯」或「分享」<br>選「<b>在 Safari 中開啟</b>」" : "點右上角「⋮」<br>選「<b>在瀏覽器中開啟</b>」") + '</p>' +
      '<button id="inappCopy">複製網址</button><small id="inappMsg"></small></div><div class="inapp-arrow">↗</div>';
    document.body.appendChild(d);
    document.getElementById("inappCopy").onclick = function () {
      var url = location.href.split("?")[0];
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { document.getElementById("inappMsg").textContent = "已複製，貼到 Safari／Chrome 打開"; }, function () { document.getElementById("inappMsg").textContent = url; });
    };
  });
})();
</script>
<link rel="stylesheet" href="style.css?v=6.5.1">

<body>
<canvas id="game"></canvas>

<!-- 手機操作：左半邊拖曳＝搖桿（畫在 canvas 上），右下角是技能按鈕 -->
<div id="pad" class="hidden">
  <button class="btn btn-atk" data-act="attack" aria-label="劍擊">劍擊<small>J</small></button>
  <button class="btn btn-skill" data-act="spin" aria-label="劍陣">劍陣<small>K</small><i class="cd"></i></button>
  <button class="btn btn-roll" data-act="roll" aria-label="閃身">閃身<small>空白</small><i class="cd"></i></button>
  <button class="btn btn-ult" data-act="ult" aria-label="天罰">天罰<small>U</small></button>
  <button class="btn btn-pot" data-act="potion" aria-label="丹藥">丹藥<b class="count">3</b><small>H</small><i class="cd"></i></button>
</div>

<!-- 右上角：暫停、音效開關 -->
<div id="hud" class="hidden"><button data-h="bag" class="hbtn">🎒<small>背包</small></button><button data-h="ap" class="hbtn">⭐<small>角色</small></button><button data-h="tp" class="hbtn">🌀<small>傳送</small></button><button data-h="swap" class="hbtn">⚔️<small>換武器</small></button><button data-h="rank" class="hbtn">🏆<small>排行</small></button></div>
<div id="topbar"><div id="quick"></div><button id="pauseBtn" class="tbtn hidden" aria-label="暫停">⏸</button><button id="muteBtn" class="tbtn" aria-label="音效開關">🔊</button></div>

<div id="screen" class="screen">
  <div class="panel">
    <h1>萬劍<br>仙途</h1>
    <p class="sub">PIXEL RAID · 原型 v0.3</p>
    <button id="start" class="big">踏上仙途</button>
    <div class="howto">
      <p><b>第一關 御劍</b>　左右拖曳／A、D 選門，<span class="blue">藍門</span>加飛劍、<span class="red">紅門</span>扣飛劍，閃開紫色妖群</p>
      <p><b>第二關 渡劫</b>　WASD／方向鍵 移動　J 劍擊　K 劍陣　空白鍵 閃身　H 丹藥　U 天罰（集滿能量）</p>
      <p><b>手機</b>　左半邊拖曳移動，右下按鈕放技能（建議橫放）</p>
      <p>飛劍越多，渡劫時自動齊射的傷害越高。地上出現<span class="red">紅色警示</span>就快閃開！</p>
    </div>
  </div>
</div>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14111c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>暗焰魔像討伐戰</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- 手機操作：左半邊拖曳＝搖桿（畫在 canvas 上），右下角是技能按鈕 -->
<div id="pad" class="hidden">
  <button class="btn btn-atk" data-act="attack" aria-label="攻擊">攻擊<small>J</small></button>
  <button class="btn btn-skill" data-act="spin" aria-label="旋風斬">旋風<small>K</small><i class="cd"></i></button>
  <button class="btn btn-roll" data-act="roll" aria-label="翻滾">翻滾<small>空白</small><i class="cd"></i></button>
  <button class="btn btn-ult" data-act="ult" aria-label="必殺技">必殺<small>U</small></button>
  <button class="btn btn-pot" data-act="potion" aria-label="藥水">藥水<b class="count">3</b><small>H</small><i class="cd"></i></button>
</div>

<div id="screen" class="screen">
  <div class="panel">
    <h1>暗焰魔像<br>討伐戰</h1>
    <p class="sub">PIXEL RAID · 原型 v0.1</p>
    <button id="start" class="big">開始討伐</button>
    <div class="howto">
      <p><b>電腦</b>　WASD／方向鍵 移動　J 攻擊　K 旋風斬　空白鍵 翻滾　H 藥水　U 必殺（集滿能量）</p>
      <p><b>手機</b>　左半邊拖曳移動，右下按鈕放技能（建議橫放）</p>
      <p>地上出現<span class="red">紅色警示</span>就快閃開！翻滾時無敵。</p>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>

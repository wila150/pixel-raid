<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14111c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>御劍渡劫</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- 手機操作：左半邊拖曳＝搖桿（畫在 canvas 上），右下角是技能按鈕 -->
<div id="pad" class="hidden">
  <button class="btn btn-atk" data-act="attack" aria-label="劍擊">劍擊<small>J</small></button>
  <button class="btn btn-skill" data-act="spin" aria-label="劍陣">劍陣<small>K</small><i class="cd"></i></button>
  <button class="btn btn-roll" data-act="roll" aria-label="閃身">閃身<small>空白</small><i class="cd"></i></button>
  <button class="btn btn-ult" data-act="ult" aria-label="天罰">天罰<small>U</small></button>
  <button class="btn btn-pot" data-act="potion" aria-label="丹藥">丹藥<b class="count">3</b><small>H</small><i class="cd"></i></button>
</div>

<!-- 右上角：暫停、音效開關 -->
<div id="hud" class="hidden"><button data-h="bag" class="hbtn">🎒<small>背包</small></button><button data-h="ap" class="hbtn">⭐<small>角色</small></button><button data-h="tp" class="hbtn">🌀<small>傳送</small></button><button data-h="swap" class="hbtn">⚔️<small>換武器</small></button></div>
<div id="topbar"><button id="pauseBtn" class="tbtn hidden" aria-label="暫停">⏸</button><button id="muteBtn" class="tbtn" aria-label="音效開關">🔊</button></div>

<div id="screen" class="screen">
  <div class="panel">
    <h1>御劍<br>渡劫</h1>
    <p class="sub">PIXEL RAID · 原型 v0.3</p>
    <button id="start" class="big">踏上仙途</button>
    <div class="howto">
      <p><b>第一關 御劍</b>　左右拖曳／A、D 選門，<span class="blue">藍門</span>加飛劍、<span class="red">紅門</span>扣飛劍，閃開紫色妖群</p>
      <p><b>第二關 渡劫</b>　WASD／方向鍵 移動　J 劍擊　K 劍陣　空白鍵 閃身　H 丹藥　U 天罰（集滿能量）</p>
      <p><b>手機</b>　左半邊拖曳移動，右下按鈕放技能（建議橫放）</p>
      <p>飛劍越多，渡劫時自動齊射的傷害越高。地上出現<span class="red">紅色警示</span>就快閃開！</p>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/save.js"></script>
<script src="js/equip.js"></script>
<script src="js/audio.js"></script>
<script src="js/combat.js"></script>
<script src="js/run.js"></script>
<script src="js/perks.js"></script>
<script src="js/hunt.js"></script>
<script src="js/maps.js"></script>
<script src="js/world.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
